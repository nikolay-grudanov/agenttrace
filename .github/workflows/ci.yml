name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Fast check that runs on every push. Catches broken builds before review.
  ci:
    name: CI (bun install, lint, typecheck, test, build:ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build UI
        run: bun run build:ui

      - name: Verify embed-migrations is current
        run: bun scripts/embed-migrations.ts --check

      - name: Verify npm launcher resolves a binary
        run: |
          # Smoke-check that bin/raindrop.js detects the platform and finds a
          # binary for it (linux-x64 on this runner). Skip --version since
          # the binary's bundled version doesn't change with package.json.
          node bin/raindrop.js workshop --help > /dev/null
          echo "bin/raindrop.js launches OK"

  # Build the two bundled Bun binaries on every push. Catches a broken
  # cross-compile before we cut a release.
  build-binaries:
    name: Build bundled binaries (linux-x64, windows-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build UI
        run: bun run build:ui

      - name: Build raindrop-linux-x64
        run: bun scripts/build-bun.ts --target=bun-linux-x64

      - name: Build raindrop-windows-x64.exe
        run: bun scripts/build-bun.ts --target=bun-windows-x64

      - name: Verify binaries exist and are non-empty
        run: |
          ls -lh build/bun/raindrop-bun-linux-x64 build/bun/raindrop-bun-windows-x64.exe
          test -s build/bun/raindrop-bun-linux-x64
          test -s build/bun/raindrop-bun-windows-x64.exe

      - name: Smoke-test linux binary --version
        run: build/bun/raindrop-bun-linux-x64 --version
